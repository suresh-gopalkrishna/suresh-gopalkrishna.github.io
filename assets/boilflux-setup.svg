<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="t d">
  <title id="t">Moving-plate jet quench measured by an IR camera</title>
  <desc id="d">A water jet hits a hot metal plate that moves to the left. The surface heat flux on the quenched face is unknown; an infrared camera measures the temperature of the back face, and BoilFlux infers the flux from it.</desc>
  <defs>
    <linearGradient id="plate" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2d6fae"/>
      <stop offset="0.38" stop-color="#5fa6d9"/>
      <stop offset="0.5" stop-color="#f7a64f"/>
      <stop offset="0.72" stop-color="#f26b1d"/>
      <stop offset="1" stop-color="#d33a1f"/>
    </linearGradient>
    <linearGradient id="jet" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset="1" stop-color="#4cc3ff"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f26b1d"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff">

    <!-- nozzle and jet -->
    <rect x="212" y="14" width="36" height="14" rx="3" fill="#cfd8e3"/>
    <rect x="221" y="28" width="18" height="16" fill="#aab7c7"/>
    <polygon points="223,44 237,44 242,150 218,150" fill="url(#jet)" opacity="0.92"/>
    <text x="200" y="36" text-anchor="end" opacity="0.85">water jet</text>

    <!-- liquid film (wetted, left) and vapour film (hot, right) -->
    <path d="M218 149 C190 143 150 145 96 148" stroke="#4cc3ff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M242 149 C262 144 286 144 312 147" stroke="#9fdcff" stroke-width="2.5" fill="none" stroke-dasharray="4 4" stroke-linecap="round"/>
    <g fill="none" stroke="#9fdcff" stroke-width="1.2" opacity="0.9">
      <circle cx="266" cy="139" r="3"/><circle cx="284" cy="136" r="2.2"/><circle cx="300" cy="140" r="2.6"/>
    </g>
    <text x="52" y="134" font-size="10.5" opacity="0.75">wetted · nucleate</text>
    <text x="320" y="134" font-size="10.5" opacity="0.75">vapour film</text>

    <!-- plate -->
    <rect x="40" y="150" width="400" height="36" rx="4" fill="url(#plate)"/>
    <rect x="40" y="150" width="400" height="36" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="436" y="173" text-anchor="end" font-weight="600">hot plate · 500 °C</text>
    <text x="46" y="173" font-weight="600">cooled</text>

    <!-- plate motion -->
    <line x1="436" y1="206" x2="376" y2="206" stroke="#ffffff" stroke-width="2" marker-end="url(#aw)"/>
    <text x="436" y="222" text-anchor="end" font-size="10.5" opacity="0.8">plate moves</text>

    <!-- unknown heat flux at the quenched face -->
    <g stroke="#f26b1d" stroke-width="2.4" marker-end="url(#ah)">
      <line x1="196" y1="150" x2="196" y2="122"/>
      <line x1="230" y1="150" x2="230" y2="104" stroke-width="3"/>
      <line x1="264" y1="150" x2="264" y2="118"/>
      <line x1="166" y1="150" x2="166" y2="130" stroke-width="1.8"/>
    </g>
    <text x="252" y="96" fill="#ffb27d" font-weight="700" font-size="14">q(x, y, t) = ?</text>
    <text x="252" y="112" fill="#ffb27d" font-size="10.5" opacity="0.9">quenched face — cannot be measured</text>

    <!-- IR camera and view cone onto the back face -->
    <polygon points="230,262 110,187 350,187" fill="url(#cone)"/>
    <line x1="230" y1="262" x2="110" y2="187" stroke="#ffffff" stroke-opacity="0.45" stroke-dasharray="3 4"/>
    <line x1="230" y1="262" x2="350" y2="187" stroke="#ffffff" stroke-opacity="0.45" stroke-dasharray="3 4"/>
    <rect x="200" y="262" width="60" height="38" rx="6" fill="#1d3d63" stroke="#ffffff" stroke-opacity="0.6"/>
    <circle cx="230" cy="264" r="9" fill="#0a1b2e" stroke="#4cc3ff" stroke-width="2"/>
    <text x="272" y="280" font-weight="600">IR camera</text>
    <text x="272" y="296" font-size="10.5" opacity="0.8">back-face temperature T(x, y, t)</text>

    <!-- inference arrow -->
    <path d="M150 296 C 70 296 30 260 30 214" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-opacity="0.8" marker-end="url(#aw)"/>
    <text x="40" y="316" font-size="10.5" opacity="0.85">BoilFlux: back-face T → surface q</text>
  </g>
</svg>
